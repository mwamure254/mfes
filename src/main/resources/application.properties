spring.application.name=mfes

##Database settings
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mfes}?${URL_SERVICE:serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

server.port=${SERVER_PORT:8080}

spring.web.resources.cache.period=0
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
logging.level.org.springframework.web=DEBUG
spring.thymeleaf.cache=false

app.base-url=${BASE_URL:http://localhost:8080}
app.upload-dir=${UPLOAD_DIR:./uploads}

app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

spring.mail.host=${MAIL_HOST:loalhost}
spring.mail.port=${MAIL_PORT:}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}  
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true