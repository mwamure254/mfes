<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>MFES | Branch Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">
  <div class="card shadow-sm">
    <div class="card-header bg-secondary text-white">
      <h4 class="mb-0"><i class="bi bi-building me-2"></i>Branch Registration</h4>
    </div>

    <form th:action="@{/branches/save}" th:object="${branch}" method="post" enctype="multipart/form-data">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <div class="card-body">

        <ul class="nav nav-tabs mb-3">
          <li class="nav-item"><button type="button" class="nav-link active" data-bs-toggle="tab" data-bs-target="#basic">Branch Info</button></li>
          <li class="nav-item"><button type="button" class="nav-link" data-bs-toggle="tab" data-bs-target="#location">Location</button></li>
          <li class="nav-item"><button type="button" class="nav-link" data-bs-toggle="tab" data-bs-target="#management">Management</button></li>
          <li class="nav-item"><button type="button" class="nav-link" data-bs-toggle="tab" data-bs-target="#targets">Targets & PAR</button></li>
          <li class="nav-item"><button type="button" class="nav-link" data-bs-toggle="tab" data-bs-target="#documents">Documents</button></li>
        </ul>

        <div class="tab-content">
          <!-- TAB 1: BRANCH INFO -->
          <div class="tab-pane fade show active" id="basic">
            <div class="row g-3">
              <div class="col-md-3">
                <label class="form-label">Branch Code</label>
                <input type="text" class="form-control" th:field="*{code}" placeholder="BR-MK-01" required>
              </div>
              <div class="col-md-5">
                <label class="form-label">Branch Name</label>
                <input type="text" class="form-control" th:field="*{name}" placeholder="Mariakani Branch" required>
              </div>
              <div class="col-md-4">
                <label class="form-label">Branch Type</label>
                <select class="form-select" th:field="*{branchType}">
                  <option value="MAIN">Main Branch</option>
                  <option value="AGENCY">Agency</option>
                  <option value="SATELLITE">Satellite</option>
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label">Date Opened</label>
                <input type="date" class="form-control" th:field="*{dateOpened}">
              </div>
              <div class="col-md-3">
                <label class="form-label">Region</label>
                <input type="text" class="form-control" th:field="*{region}" placeholder="Coast Region">
              </div>
              <div class="col-md-3">
                <label class="form-label">Status</label>
                <select class="form-select" th:field="*{status}">
                  <option value="ACTIVE">Active</option>
                  <option value="INACTIVE">Inactive</option>
                </select>
              </div>
              <div class="col-12">
                <label class="form-label">Branch Description</label>
                <textarea class="form-control" rows="2" th:field="*{description}"></textarea>
              </div>
            </div>
          </div>

          <!-- TAB 2: LOCATION -->
          <div class="tab-pane fade" id="location">
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label">County</label>
                <input type="text" class="form-control" th:field="*{county}">
              </div>
              <div class="col-md-4">
                <label class="form-label">Sub-County</label>
                <input type="text" class="form-control" th:field="*{subCounty}">
              </div>
              <div class="col-md-4">
                <label class="form-label">Town</label>
                <input type="text" class="form-control" th:field="*{town}">
              </div>
              <div class="col-12">
                <label class="form-label">Physical Address</label>
                <textarea class="form-control" rows="2" th:field="*{address}"></textarea>
              </div>
              <div class="col-md-3">
                <label class="form-label">Office Phone</label>
                <input type="tel" class="form-control" th:field="*{officePhone}">
              </div>
              <div class="col-md-3">
                <label class="form-label">Office Email</label>
                <input type="email" class="form-control" th:field="*{officeEmail}">
              </div>
              <div class="col-md-3">
                <label class="form-label">Latitude</label>
                <input type="text" class="form-control" th:field="*{latitude}">
              </div>
              <div class="col-md-3">
                <label class="form-label">Longitude</label>
                <input type="text" class="form-control" th:field="*{longitude}">
              </div>
            </div>
          </div>

          <!-- TAB 3: MANAGEMENT -->
          <div class="tab-pane fade" id="management">
            <h6 class="text-muted mb-3">Branch Incharge / Manager</h6>
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label">Branch Manager</label>
                <select class="form-select" th:field="*{managerId}">
                  <option value="">Select Manager</option>
                  <option th:each="u : ${users}" th:value="${u.id}" th:text="${u.fullName}"></option>
                </select>
              </div>
              <div class="col-md-2">
                <label class="form-label">Manager Phone</label>
                <input type="tel" class="form-control" th:field="*{managerPhone}">
              </div>
              <div class="col-md-3">
                <label class="form-label">Manager Email</label>
                <input type="email" class="form-control" th:field="*{managerEmail}">
              </div>
              <div class="col-md-3">
                <label class="form-label">Date Appointed</label>
                <input type="date" class="form-control" th:field="*{managerAppointedDate}">
              </div>
            </div>
          </div>

          <!-- TAB 4: TARGETS & PAR -->
          <div class="tab-pane fade" id="targets">
            <h6 class="text-muted mb-3">Branch Performance Targets</h6>
            <div class="row g-3">
              <div class="col-md-3">
                <label class="form-label">Target Loan Portfolio Ksh</label>
                <input type="number" step="0.01" class="form-control" th:field="*{targetLoanPortfolio}">
              </div>
              <div class="col-md-3">
                <label class="form-label">Target Savings Ksh</label>
                <input type="number" step="0.01" class="form-control" th:field="*{targetSavings}">
              </div>
              <div class="col-md-2">
                <label class="form-label">Target Groups</label>
                <input type="number" class="form-control" th:field="*{targetGroups}">
              </div>
              <div class="col-md-2">
                <label class="form-label">Target Clients</label>
                <input type="number" class="form-control" th:field="*{targetClients}">
              </div>
              <div class="col-md-2">
                <label class="form-label">PAR Target %</label>
                <input type="number" step="0.1" class="form-control" th:field="*{parTarget}">
              </div>
            </div>
          </div>

          <!-- TAB 5: DOCUMENTS -->
          <div class="tab-pane fade" id="documents">
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label">Branch License</label>
                <input type="file" class="form-control" name="license" accept=".pdf,.jpg,.png">
              </div>
              <div class="col-md-4">
                <label class="form-label">Lease Agreement</label>
                <input type="file" class="form-control" name="leaseAgreement" accept=".pdf">
              </div>
              <div class="col-md-4">
                <label class="form-label">Branch Photo</label>
                <input type="file" class="form-control" name="branchPhoto" accept="image/*">
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="card-footer d-flex justify-content-end gap-2">
        <a href="/branches" class="btn btn-outline-secondary">Cancel</a>
        <button type="submit" class="btn btn-secondary"><i class="bi bi-save me-1"></i> Save Branch</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
