<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<th:block th:replace="~{partials/_header :: common_header(~{::title/text()},~{::link},~{::meta})}">
  <!-- Custom meta data for this template-->
  <meta name="description" content="mfes home page">
  <meta name="author" content="mfano">

  <!-- Custom title for this page-->
  <title>MFES | Business</title>

  <!-- Custom styles for this page-->
</th:block>

<body>
  <div class="container-scroller">
    <!-- partial:partials/_topbar.html -->

    <!-- ======= Topbar ======= -->
    <th:block th:insert="~{partials/_topbar}" />
    <!-- =====End Topbar=====-->

    <!-- partial -->
    <div class="container-fluid page-body-wrapper">
      <!-- partial:partials/_sidebar.html -->

      <!-- ======= Sidebar ======= -->
      <th:block th:insert="~{partials/_sidebar}" />
      <!-- =====End Sidebar=====-->

      <!-- partial -->
      <div class="main-panel">
        <div class="content-wrapper">
          <div class="row" id="proBanner">
            <div class="col-12">
              <span class="d-flex align-items-center purchase-popup">
                <p>Like what you see? Check out our premium version for more.</p>
                <a href="https://github.com/BootstrapDash/ConnectPlusAdmin-Free-Bootstrap-Admin-Template"
                  target="_blank" class="btn ml-auto download-button">Download Free Version</a>
                <a href="http://www.bootstrapdash.com/demo/connect-plus/jquery/template/" target="_blank"
                  class="btn purchase-button">Upgrade To Pro</a>
                <i class="mdi mdi-close" id="bannerClose"></i>
              </span>
            </div>
          </div>
          <div class="d-xl-flex justify-content-between align-items-start">
            <h2 class="text-dark font-weight-bold mb-2"> Overview dashboard </h2>
            <div class="d-sm-flex justify-content-xl-between align-items-center mb-2">
              <div class="btn-group bg-white p-3" role="group" aria-label="Basic example">
                <button type="button" class="btn btn-link text-light py-0 border-right">7 Days</button>
                <button type="button" class="btn btn-link text-dark py-0 border-right">1 Month</button>
                <button type="button" class="btn btn-link text-light py-0">3 Month</button>
              </div>
              <div class="dropdown ml-0 ml-md-4 mt-2 mt-lg-0">
                <button class="btn bg-white dropdown-toggle p-3 d-flex align-items-center" type="button"
                  id="dropdownMenuButton1" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false"> <i
                    class="mdi mdi-calendar mr-1"></i>24 Mar 2019 - 24 Mar 2019 </button>
                <div class="dropdown-menu dropdown-menu-right" aria-labelledby="dropdownMenuButton1">
                  <h6 class="dropdown-header">Settings</h6>
                  <a class="dropdown-item" href="#">Action</a>
                  <a class="dropdown-item" href="#">Another action</a>
                  <a class="dropdown-item" href="#">Something else here</a>
                  <div class="dropdown-divider"></div>
                  <a class="dropdown-item" href="#">Separated link</a>
                </div>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-md-12">
              <div class="d-sm-flex justify-content-between align-items-center transaparent-tab-border">
                <ul class="nav nav-tabs tab-transparent" role="tablist">
                  <li class="nav-item">
                    <a class="nav-link" id="users-tab" data-toggle="tab" href="#users-1" role="tab">Users</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link active" id="business-tab" data-toggle="tab" href="#business-1" role="tab"
                      aria-selected="false">Business</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" id="performance-tab" data-toggle="tab" href="#performance-1" role="tab"
                      aria-selected="false">Performance</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" id="conversion-tab" data-toggle="tab" href="#conversion-1" role="tab"
                      aria-selected="false">Conversion</a>
                  </li>
                </ul>
                <div class="d-md-block d-none">
                  <a href="#" class="text-light p-1"><i class="mdi mdi-view-dashboard"></i></a>
                  <a href="#" class="text-light p-1"><i class="mdi mdi-dots-vertical"></i></a>
                </div>
              </div>

              <!-- tab contents -->
              <div class="tab-content tab-transparent-content">

                <th:block th:insert="~{partials/_users}" />
                <!-- =====End Users Tab=====-->

                <th:block th:insert="~{partials/_business}" />
                <!-- =====End Business Tab=====-->

                <th:block th:insert="~{partials/_performance}" />
                <!-- =====End Performance Tab=====-->

                <th:block th:insert="~{partials/_conversion}" />
                <!-- =====End Conversion Tab=====-->
              </div>
              <!-- partial -->

            </div>
          </div>
          <!-- content-wrapper ends -->
          <!-- partial:partials/_footer.html -->
          <th:block th:insert="~{partials/_footer}" />
          <!-- =====End Sidebar=====-->
          <!-- partial -->
        </div>
        <!-- main-panel ends -->
      </div>
      <!-- page-body-wrapper ends -->
    </div>
    <!-- container-scroller -->

    <!-- ======= Sidebar ======= -->
    <th:block th:insert="~{partials/_scripts}" />
    <!-- =====End Sidebar=====-->
</body>

</html>
