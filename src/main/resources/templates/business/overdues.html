<form th:action="@{/loans/dues}" method="get"
      class="row g-2 align-items-end mb-3">

    <div class="col-md-4">
        <label for="filter" class="form-label">Due status</label>
        <select id="filter" name="filter" class="form-select">
            <option value="overdue"
                    th:selected="${filter == 'overdue'}">
                Overdue
            </option>
            <option value="today"
                    th:selected="${filter == 'today'}">
                Due Today
            </option>
            <option value="forecast"
                    th:selected="${filter == 'forecast'}">
                Future Forecast
            </option>
            <option value="all"
                    th:selected="${filter == 'all'}">
                All Unpaid
            </option>
        </select>
    </div>

    <div class="col-md-3">
        <label for="days" class="form-label">Forecast days</label>
        <select id="days" name="days" class="form-select">
            <option value="7" th:selected="${days == 7}">7 days</option>
            <option value="30" th:selected="${days == 30}">30 days</option>
            <option value="90" th:selected="${days == 90}">90 days</option>
        </select>
    </div>

    <div class="col-md-2">
        <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-funnel"></i> Filter
        </button>
    </div>
</form>

<table class="table table-hover table-striped align-middle">
    <thead class="table-light">
        <tr>
            <th>Member</th>
            <th>Loan</th>
            <th>Due Date</th>
            <th class="text-end">Amount Due</th>
            <th class="text-end">Paid</th>
            <th class="text-end">Outstanding</th>
            <th>Status</th>
        </tr>
    </thead>

    <tbody>
        <tr th:each="item : ${dues}">
            <td th:text="${item.loanAccount.member.fin
                + ' ' + item.loanAccount.member.lan}">
                Member Name
            </td>

            <td th:text="${item.loanAccount.id}">1</td>

            <td th:text="${item.dueDate}">2026-10-17</td>

            <td class="text-end"
                th:text="${#numbers.formatDecimal(item.amountDue, 1, 2)}">
                0.00
            </td>

            <td class="text-end"
                th:text="${#numbers.formatDecimal(item.amountPaid, 1, 2)}">
                0.00
            </td>

            <td class="text-end fw-bold"
                th:text="${#numbers.formatDecimal(
                    item.amountDue.subtract(item.amountPaid), 1, 2)}">
                0.00
            </td>

            <td>
                <span th:if="${item.dueDate.isBefore(today)}"
                      class="badge bg-danger">Overdue</span>
                <span th:if="${item.dueDate.isEqual(today)}"
                      class="badge bg-warning text-dark">Due Today</span>
                <span th:if="${item.dueDate.isAfter(today)}"
                      class="badge bg-info text-dark">Upcoming</span>
            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(dues)}">
            <td colspan="7" class="text-center text-muted py-4">
                No unpaid repayments found for this filter.
            </td>
        </tr>
    </tbody>
</table>
