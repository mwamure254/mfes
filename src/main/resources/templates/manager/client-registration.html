<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<th:block th:replace="~{partials/_header :: common_header(~{::title/text()},~{::link},~{::meta})}">
  <meta name="description" content="mfes client-registration page">
  <meta name="author" content="mfano">
  <title>MFES | Client Registration</title>
</th:block>

<body class="bg-light">
  <th:block th:insert="~{partials/_topbar}" />
  <th:block th:insert="~{partials/_sidebar}" />

  <main id="main" class="main d-flex flex-column min-vh-100">
    <!-- Page Heading -->
    <div class="pagetitle d-sm-flex align-items-center justify-content-between mb-4">
      <div>
        <h1 class="fw-bold mb-1">

          <i class="bi bi-person-plus me-2"></i>Client Registration
        </h1>
      </div>

      <!-- Breadcrumb -->
      <nav>
        <ol class="breadcrumb">
          <li class="breadcrumb-item">
            <a th:href="@{/}">
              <i class="bi bi-house-door me-1"></i>
              Dashboard
            </a>
          </li>
          <li class="breadcrumb-item">
            <a th:href="@{/manager/clients}">Clients</a>
          </li>
          <li class="breadcrumb-item active" aria-current="page">Registration</li>
        </ol>
      </nav>
    </div><!-- End Page Title -->

    <div class="card shadow-sm">

      <!-- IMPORTANT: enctype for file upload -->
      <form th:action="@{/clients/new}" th:object="${client}" method="post" enctype="multipart/form-data">
        <!--<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />-->
        <div class="card-body">

          <ul class="nav nav-tabs mb-3" id="clientTab" role="tablist">
            <li class="nav-item"><button type="button" class="nav-link active" data-bs-toggle="tab"
                data-bs-target="#bio">Bio Data</button></li>
            <li class="nav-item"><button type="button" class="nav-link" data-bs-toggle="tab"
                data-bs-target="#business">Business</button></li>
            <li class="nav-item"><button type="button" class="nav-link" data-bs-toggle="tab"
                data-bs-target="#contact">Contact</button></li>
            <li class="nav-item"><button type="button" class="nav-link" data-bs-toggle="tab"
                data-bs-target="#documents">Documents</button></li> <!-- NEW -->
            <li class="nav-item"><button type="button" class="nav-link" data-bs-toggle="tab"
                data-bs-target="#other">Other Info</button></li>
          </ul>

          <div class="tab-content">
            <!-- BIO FORM -->
            <div class="tab-pane fade show active" id="bio">
              <div class="row g-3">
                <div class="col-md-4">
                  <label class="form-label">First Name<sup class="text-danger">*</sup></label>
                  <input type="text" class="form-control" th:field="*{fin}" required>
                </div>
                <div class="col-md-4">
                  <label class="form-label">Last Name<sup class="text-danger">*</sup></label>
                  <input type="text" class="form-control" th:field="*{lan}" required>
                </div>
                <div class="col-md-4">
                  <label class="form-label">ID Number<sup class="text-danger">*</sup></label>
                  <input type="text" class="form-control" th:field="*{idNumber}" required>
                </div>
                <div class="col-md-4">
                  <label class="form-label">Gender<sup class="text-danger">*</sup></label>
                  <select class="form-select" th:field="*{gender}" required>
                    <option value="">SELECT</option>
                    <option value="MALE">Male</option>
                    <option value="FEMALE">Female</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label class="form-label">Date of Birth<sup class="text-danger">*</sup></label>
                  <input type="date" class="form-control" th:field="*{dob}">
                </div>
                <div class="col-md-4">
                  <label class="form-label">Group<sup class="text-danger">*</sup></label>
                  <select class="form-select" th:field="*{group}" required>
                    <option value="">SELECT</option>
                    <option th:each="g : ${groups}" th:value="${g.id}" th:text="${g.name}"></option>
                  </select>
                </div>

                <div class="col-md-4">
                  <label class="form-label">Marital Status</label>
                  <select class="form-select" name="maritalStatus" required>
                    <option value="">SELECT</option>
                    <option value="Single">Single</option>
                    <option value="Married">Married</option>
                    <option value="Devorced">Devorced</option>
                    <option value="Separated">Separated</option>
                    <option value="Engaged">Engaged</option>
                  </select>
                </div>

                <div class="col-md-4">
                  <label class="form-label">Residence Type<sup class="text-danger">*</sup></label>
                  <select class="form-select" name="residenceType" required>
                    <option value="">SELECT</option>
                    <option value="Rental">Rental</option>
                    <option value="Mortgage">Mortgage</option>
                    <option value="Permanent">Permanent</option>
                  </select>
                </div>

                <div class="col-md-4">
                  <label class="form-label">Education Level<sup class="text-danger">*</sup></label>
                  <select class="form-select" name="educationLevel">
                    <option value="">SELECT</option>
                    <option value="Primary">Primary</option>
                    <option value="Secondary">Secondary</option>
                    <option value="Certificate">Certificate</option>
                    <option value="Diploma">Diploma</option>
                    <option value="Degree">Degree</option>
                    <option value="Other">Other</option>
                  </select>
                </div>
              </div>
            </div>

            <!-- BUSINESS FORM -->
            <div class="tab-pane fade" id="business">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Business Name</label>
                  <input type="text" class="form-control" name="businessName">
                </div>
                <div class="col-md-6">
                  <label class="form-label">Business Type</label>
                  <input type="text" class="form-control" name="businessType">
                </div>
                <div class="col-md-8">
                  <label class="form-label">Business Location</label>
                  <input type="text" class="form-control" name="businessLocation">
                </div>
                <div class="col-md-4">
                  <label class="form-label">Monthly Income Ksh</label>
                  <input type="number" step="0.01" class="form-control" name="monthlyIncome">
                </div>
              </div>
            </div>

            <!-- CONTACT FORM -->
            <div class="tab-pane fade" id="contact">
              <div class="row g-3">
                <div class="col-md-4"><label class="form-label">Phone</label><input type="tel" class="form-control"
                    th:field="*{phone}"></div>
                <div class="col-md-4"><label class="form-label">M-Pesa<sup class="text-danger">*</sup></label><input type="tel" class="form-control"
                    th:field="*{mpesaNumber}"></div>
                <div class="col-md-4"><label class="form-label">Email</label><input type="email" class="form-control"
                    th:field="*{email}"></div>
                <div class="col-12"><label class="form-label">Physical Address<sup class="text-danger">*</sup></label>
                  <textarea class="form-control" placeholder="Describe your location giving nearest larndmark..."
                    rows="3" th:field="*{address}"></textarea>
                </div>
              </div>
            </div>

            <!-- DOCUMENTS UPLOAD -->
            <div class="tab-pane fade" id="documents">
              <div class="row g-4">

                <div class="col-md-3">
                  <label class="form-label">Passport Photo<sup class="text-danger">*</sup></label>
                  <input type="file" class="form-control form-control-sm" name="passportPhoto" accept="image/*"
                    onchange="preview(this, 'passportPreview')">
                </div>

                <div class="col-md-3">
                  <label class="form-label">ID Front<sup class="text-danger">*</sup></label>
                  <input type="file" class="form-control form-control-sm" name="idFront" accept="image/*,.pdf"
                    onchange="preview(this, 'idFrontPreview')">
                </div>

                <div class="col-md-3">
                  <label class="form-label">ID Back<sup class="text-danger">*</sup></label>
                  <input type="file" class="form-control form-control-sm" name="idBack" accept="image/*,.pdf"
                    onchange="preview(this, 'idBackPreview')">
                </div>

                <div class="col-md-3">
                  <label class="form-label">Business Photo</label>
                  <input type="file" class="form-control form-control-sm" name="businessPhoto" accept="image/*"
                    onchange="preview(this, 'businessPreview')">
                </div>

                <div class="col-md-6">
                  <label class="form-label">Signature<sup class="text-danger">*</sup></label>
                  <input type="file" class="form-control form-control-sm" name="signature" accept="image/*,.pdf">
                  <small class="text-muted">Upload scanned signature or clear photo on white paper</small>
                </div>

              </div>
            </div>

            <!-- OTHER INFO -->
            <div class="tab-pane fade" id="other">
              <div class="row g-3">
                <div class="col-md-6"><label class="form-label">Next of Kin</label><input type="text"
                    class="form-control" name="nextOfKin"></div>
                <div class="col-md-3"><label class="form-label">Kin Phone</label><input type="tel" class="form-control"
                    name="kinPhone"></div>
                <div class="col-md-3"><label class="form-label">Kin Relationship</label><input type="text"
                    class="form-control" name="kinRelationship"></div>
                <div class="col-12"><label class="form-label">Remarks</label><textarea class="form-control" rows="2"
                    name="remarks"></textarea></div>
              </div>
            </div>
          </div>
        </div>

        <div class="card-footer d-flex justify-content-end gap-2">
          <a href="/manager/clients" class="btn btn-outline-secondary">Cancel</a>
          <button type="reset" class="btn btn-outline-warning"><i class="bi bi-brush me-1"></i> Reset</button>
          <button type="submit" class="btn btn-outline-primary"><i class="bi bi-save me-1"></i> Save Client</button>
        </div>
      </form>
    </div>
  </main>

  <th:block th:insert="~{partials/_footer}" />
  <script>
    function preview(input, imgId) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = e => document.getElementById(imgId).src = e.target.result;
        reader.readAsDataURL(input.files[0]);
      }
    }
  </script>
</body>

</html>
