<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>MFES | Group Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">
  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
      <h4 class="mb-0"><i class="bi bi-people-fill me-2"></i>Group Registration</h4>
    </div>

    <form th:action="@{/groups/save}" th:object="${group}" method="post" enctype="multipart/form-data">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <div class="card-body">

        <!-- TABS -->
        <ul class="nav nav-tabs mb-3">
          <li class="nav-item"><button type="button" class="nav-link active" data-bs-toggle="tab" data-bs-target="#groupInfo">Group Info</button></li>
          <li class="nav-item"><button type="button" class="nav-link" data-bs-toggle="tab" data-bs-target="#location">Location</button></li>
          <li class="nav-item"><button type="button" class="nav-link" data-bs-toggle="tab" data-bs-target="#officials">Officials</button></li>
          <li class="nav-item"><button type="button" class="nav-link" data-bs-toggle="tab" data-bs-target="#documents">Documents</button></li>
        </ul>

        <div class="tab-content">
          <!-- TAB 1: GROUP INFO -->
          <div class="tab-pane fade show active" id="groupInfo">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Group Name</label>
                <input type="text" class="form-control" th:field="*{name}" required>
              </div>
              <div class="col-md-3">
                <label class="form-label">Registration No</label>
                <input type="text" class="form-control" th:field="*{registrationNumber}">
              </div>
              <div class="col-md-3">
                <label class="form-label">Date Formed</label>
                <input type="date" class="form-control" th:field="*{dateFormed}">
              </div>
              <div class="col-md-3">
                <label class="form-label">Group Type</label>
                <select class="form-select" th:field="*{groupType}">
                  <option value="CHAMA">Chama</option>
                  <option value="SACCO">Sacco</option>
                  <option value="SHG">Self Help Group</option>
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label">Meeting Day</label>
                <select class="form-select" th:field="*{meetingDay}">
                  <option>Monday</option><option>Tuesday</option><option>Wednesday</option>
                  <option>Thursday</option><option>Friday</option><option>Saturday</option>
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label">Meeting Time</label>
                <input type="time" class="form-control" th:field="*{meetingTime}">
              </div>
              <div class="col-md-3">
                <label class="form-label">Meeting Frequency</label>
                <select class="form-select" th:field="*{meetingFrequency}">
                  <option value="WEEKLY">Weekly</option>
                  <option value="BIWEEKLY">Bi-Weekly</option>
                  <option value="MONTHLY">Monthly</option>
                </select>
              </div>
              <div class="col-12">
                <label class="form-label">Group Objectives</label>
                <textarea class="form-control" rows="2" th:field="*{objectives}"></textarea>
              </div>
            </div>
          </div>

          <!-- TAB 2: LOCATION -->
          <div class="tab-pane fade" id="location">
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label">County</label>
                <input type="text" class="form-control" th:field="*{county}" value="Kwale">
              </div>
              <div class="col-md-4">
                <label class="form-label">Sub-County</label>
                <input type="text" class="form-control" th:field="*{subCounty}" value="Mariakani">
              </div>
              <div class="col-md-4">
                <label class="form-label">Ward</label>
                <input type="text" class="form-control" th:field="*{ward}">
              </div>
              <div class="col-md-6">
                <label class="form-label">Village / Estate</label>
                <input type="text" class="form-control" th:field="*{village}">
              </div>
              <div class="col-md-6">
                <label class="form-label">Meeting Venue</label>
                <input type="text" class="form-control" th:field="*{meetingVenue}" placeholder="Church, School, Chief's Office">
              </div>
              <div class="col-12">
                <label class="form-label">Physical Address / Landmark</label>
                <textarea class="form-control" rows="2" th:field="*{address}"></textarea>
              </div>
              <div class="col-md-6">
                <label class="form-label">GPS Latitude</label>
                <input type="text" class="form-control" th:field="*{latitude}">
              </div>
              <div class="col-md-6">
                <label class="form-label">GPS Longitude</label>
                <input type="text" class="form-control" th:field="*{longitude}">
              </div>
            </div>
          </div>

          <!-- TAB 3: OFFICIALS -->
          <div class="tab-pane fade" id="officials">
            <h6 class="text-muted">Chairperson</h6>
            <div class="row g-3 mb-3">
              <div class="col-md-4"><input type="text" class="form-control" name="chairName" placeholder="Full Name"></div>
              <div class="col-md-2"><input type="text" class="form-control" name="chairId" placeholder="ID No"></div>
              <div class="col-md-3"><input type="tel" class="form-control" name="chairPhone" placeholder="Phone"></div>
            </div>
            <h6 class="text-muted">Secretary</h6>
            <div class="row g-3 mb-3">
              <div class="col-md-4"><input type="text" class="form-control" name="secretaryName" placeholder="Full Name"></div>
              <div class="col-md-2"><input type="text" class="form-control" name="secretaryId" placeholder="ID No"></div>
              <div class="col-md-3"><input type="tel" class="form-control" name="secretaryPhone" placeholder="Phone"></div>
            </div>
            <h6 class="text-muted">Treasurer</h6>
            <div class="row g-3">
              <div class="col-md-4"><input type="text" class="form-control" name="treasurerName" placeholder="Full Name"></div>
              <div class="col-md-2"><input type="text" class="form-control" name="treasurerId" placeholder="ID No"></div>
              <div class="col-md-3"><input type="tel" class="form-control" name="treasurerPhone" placeholder="Phone"></div>
            </div>
          </div>

          <!-- TAB 4: DOCUMENTS -->
          <div class="tab-pane fade" id="documents">
            <div class="row g-4">
              <div class="col-md-4">
                <label class="form-label">Certificate of Registration</label>
                <input type="file" class="form-control" name="certificate" accept=".pdf,.jpg,.png" required>
              </div>
              <div class="col-md-4">
                <label class="form-label">Group Constitution</label>
                <input type="file" class="form-control" name="constitution" accept=".pdf">
              </div>
              <div class="col-md-4">
                <label class="form-label">Minutes of Last Meeting</label>
                <input type="file" class="form-control" name="minutes" accept=".pdf,.jpg,.png">
              </div>
              <div class="col-md-4">
                <label class="form-label">Bank Account Details</label>
                <input type="file" class="form-control" name="bankDetails" accept=".pdf,.jpg,.png">
              </div>
              <div class="col-md-4">
                <label class="form-label">Group Photo</label>
                <input type="file" class="form-control" name="groupPhoto" accept="image/*">
              </div>
              <div class="col-md-4">
                <label class="form-label">Other Documents</label>
                <input type="file" class="form-control" name="otherDocs" accept=".pdf,.jpg,.png" multiple>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="card-footer d-flex justify-content-end gap-2">
        <a href="/groups" class="btn btn-outline-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i> Register Group</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
