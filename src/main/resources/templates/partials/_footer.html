<!-- Logout Modal-->
<div class="modal fade" id="logout" tabindex="-1">
	<div class="modal-dialog modal-sm">
		<div class="modal-content">
			<div class="modal-body my-2 text-center">
				<h1><a href="#"><i class="bi bi-info-circle text-danger"></i></a></h1>
				<h5 class="text-center">
					Confirm to Logout
				</h5>
				<div class="row my-2 justify-content-center">
					<button class="btn col-sm-4 btn-warning mx-2" data-bs-dismiss="modal">Cancel</button>

					<form class="col-sm-4 btn-success mx-2" th:action="@{/logout}" method="post">
						<button class="btn btn-success" type="submit">Proceed</button>
					</form>
				</div>
			</div>

		</div>
	</div>
</div><!-- End Logout Modal-->

<!-- Floating Alerts-->
<div th:if="${message}" id="floatingAlert"
	class="alert alert-success alert-dismissible fade show position-fixed top-0 end-0 m-3 shadow" role="alert"
	style="z-index: 1080; min-width: 300px;">

	<i class="bi bi-info-circle me-2"></i>
	<strong th:text="${message}">Success!</strong>

	<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>
<div th:if="${error}" id="floatingAlert"
	class="alert alert-danger alert-dismissible fade show position-fixed top-0 end-0 m-3 shadow" role="alert"
	style="z-index: 1080; min-width: 300px;">

	<i class="bi bi-exclamation-triangle-fill me-2"></i>
	<strong th:text="${error}">Error!</strong>

	<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div><!-- End Floating Alerts-->
