<!-- Logout Modal-->
<div class="modal fade" id="logout" tabindex="-1">
	<div class="modal-dialog modal-sm">
		<div class="modal-content">
			<div class="modal-body my-2 text-center">
				<h1><a href="#"><i class="bi bi-info-circle text-danger"></i></a></h1>
				<h5 class="text-center">
					Confirm to Logout
				</h5>
				<div class="row my-2 justify-content-center">
					<button class="col-sm-4 btn btn-sm btn-outline-warning mx-2" data-bs-dismiss="modal">Cancel</button>

					<a class="col-sm-4 btn btn-sm btn-outline-success mx-2" href="/logout">Proceed</a>
				</div>
			</div>

		</div>
	</div>
</div><!-- End Logout Modal-->

<!-- Session Timeout Modal -->
<div class="modal fade" id="sessionModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
	<div class="modal-dialog modal-sm">
		<div class="modal-content">
			<div class="modal-header bg-warning">
				<h5 class="modal-title">Session Expiring</h5>
			</div>
			<div class="modal-body text-start">
				<p>Your session will expire in <span id="countdown">60</span> seconds due to inactivity.</p>
				<p>Do you want to continue?</p>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary" onclick="forceLogout()">Logout Now</button>
				<button type="button" id="continueBtn" class="btn btn-primary">Continue Session</button>
			</div>
		</div>
	</div>
</div><!--End Session-->

<!-- Floating Alerts-->
<div th:if="${message}" id="floatingAlert"
	class="alert alert-success alert-dismissible fade show position-fixed top-0 end-0 m-3 shadow" role="alert"
	style="z-index: 1080; min-width: 300px;">

	<i class="bi bi-info-circle me-2"></i>
	<strong th:text="${message}">Success!</strong>

	<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>
<div th:if="${error}" id="floatingAlert"
	class="alert alert-danger alert-dismissible fade show position-fixed top-0 end-0 m-3 shadow" role="alert"
	style="z-index: 1080; min-width: 300px;">

	<i class="bi bi-exclamation-triangle-fill me-2"></i>
	<strong th:text="${error}">Error!</strong>

	<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div><!-- End Floating Alerts-->
