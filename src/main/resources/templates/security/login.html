<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<th:block th:replace="~{partials/_header :: common_header(~{::title/text()},~{::link},~{::meta})}">
  <!-- Custom meta data for this template-->
  <meta name="description" content="mfes login page">
  <meta name="author" content="mfano">

  <!-- Custom title for this page-->
  <title>MFES | Login</title>

  <!-- Custom styles for this page-->
</th:block>

<body>
  <div class="container-scroller">
    <div class="container-fluid page-body-wrapper full-page-wrapper">
      <div class="content-wrapper d-flex align-items-center auth">
        <div class="row flex-grow">
          <div class="col-lg-4 mx-auto my-4">
            <div class="auth-form-light text-left p-5">

              <div class="brand-logo d-flex align-items-center">
                <img th:src="@{/images/mfano.png}" alt="" class="me-2"
                  style="width: 50px; height: 50px; object-fit: contain;">

                <span class="fw-bold fs-5">
                  Mfano DS
                </span>
              </div>

              <h6 class="font-weight-light">Sign in to continue.</h6>
              <form class="pt-3" th:action="@{/login}" method="post">
                <div class="form-group">
                  <input type="email" name="username" class="form-control" id="exampleInputEmail1"
                    placeholder="Username">
                </div>
                <div class="form-group">
                  <input type="password" name="password" class="form-control" id="exampleInputPassword1"
                    placeholder="Password">
                </div>
                <div class="mt-3">
                  <button type="submit" class="btn btn-block btn-primary auth-form-btn">SIGN
                    IN</a>
                </div>
              </form>
              <div class="my-2 d-flex justify-content-between align-items-center">
                <div class="form-check">
                  <label class="form-check-label text-muted">
                    <input type="checkbox" class="form-check-input"> Keep me signed in </label>
                </div>
                <a href="#" class="auth-link text-black">Forgot password?</a>
              </div>
              <div class="mb-2">
                <button type="button" class="btn btn-block btn-facebook auth-form-btn">
                  <i class="mdi mdi-facebook mr-2"></i>Connect using facebook </button>
              </div>
              
              <div class="mb-2">
                <button type="button" class="btn btn-block btn-twitter auth-form-btn">
                  <i class="mdi mdi-twitter mr-2"></i>Connect using twitter </button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- content-wrapper ends -->
    </div>
    <!-- page-body-wrapper ends -->
  </div>
  <!-- container-scroller -->

  <!-- ======= Sidebar ======= -->
  <th:block th:insert="~{partials/_scripts}" />
  <!-- =====End Sidebar=====-->
  <!-- endinject -->
</body>

</html>
